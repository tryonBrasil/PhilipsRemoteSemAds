name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Gerar APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verificar APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemoteSemAds-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "IR Remote BR $VERSION" --generate-notes
          else
            echo "Release $TAG já existe."
          fi
