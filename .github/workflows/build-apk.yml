name: Gerar APK
# Cada push em main incrementa automaticamente a versão antes de compilar.
# O APK é assinado, verificado e publicado no GitHub Releases.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      replace_existing:
        description: "Substituir os arquivos da Release atual (somente para republicar sem nova versão)"
        required: true
        type: boolean
        default: false

concurrency:
  group: version-release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Incrementar versão automaticamente em cada alteração
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          FILE=app/build.gradle
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" "$FILE")
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' "$FILE")
          test -n "$VERSION" || { echo "versionName não encontrada"; exit 1; }
          test -n "$CODE" || { echo "versionCode não encontrado"; exit 1; }
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Formato de versão inválido: $VERSION (esperado X.Y.Z)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          NEXT_CODE=$((CODE + 1))
          sed -i "s/versionCode $CODE/versionCode $NEXT_CODE/" "$FILE"
          sed -i "s/versionName '$VERSION'/versionName '$NEXT_VERSION'/" "$FILE"
          echo "Versão automática: $VERSION ($CODE) -> $NEXT_VERSION ($NEXT_CODE)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(release): versionar automaticamente $NEXT_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Validar versão e identificador
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle)
          test -n "$VERSION" || { echo "versionName ausente"; exit 1; }
          test -n "$CODE" || { echo "versionCode ausente"; exit 1; }
          echo "Versão validada: $VERSION (versionCode $CODE)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > ir-remote-release.jks
          test -s ir-remote-release.jks

      - name: Mostrar impressões digitais do certificado (Firebase)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v -keystore ir-remote-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            awk '/SHA1:/{print "SHA-1 para cadastrar no Firebase: "$0} /SHA256:/{print "SHA-256 para cadastrar no Firebase: "$0}'

      - name: Gerar APK assinado
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/ir-remote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleGithubRelease --stacktrace --info 2>&1 | tee build.log

      - name: Guardar log da compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verificar APK assinado
        run: |
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" app/build/outputs/apk/github/release/app-release.apk
          cd app/build/outputs/apk/github/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Disponibilizar APK e hash
        uses: actions/upload-artifact@v4
        with:
          name: IR-Remote-BR-${{ env.VERSION }}-release
          path: |
            app/build/outputs/apk/github/release/app-release.apk
            app/build/outputs/apk/github/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK=app/build/outputs/apk/github/release/app-release.apk
          HASH=app/build/outputs/apk/github/release/app-release.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE_EXISTING" != "true" ]; then
              echo "A Release $TAG já existe. Para republicar a mesma versão, execute manualmente e marque replace_existing."
              exit 1
            fi
            gh release upload "$TAG" "$APK" "$HASH" --clobber
          else
            gh release create "$TAG" "$APK" "$HASH" --title "IR Remote BR $VERSION" --generate-notes
          fi

      - name: Limpar keystore
        if: always()
        run: rm -f ir-remote-release.jks
