name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Gerar APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verificar APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemoteSemAds-debug
          path: app/build/outputs/apk/debug/app-debug.apk
