name: Gerar APK
# Gera APK assinado. Nunca sobrescreve uma Release existente automaticamente.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      replace_existing:
        description: "Substituir o APK da Release existente (use apenas para republicar a mesma versão)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Validar versao e identificador
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle)
          test "$VERSION" = "2.0.3" || { echo "Versao esperada 2.0.3; encontrada: $VERSION"; exit 1; }
          test -n "$CODE" || { echo "versionCode ausente"; exit 1; }
          echo "Versao validada: $VERSION (versionCode $CODE)"

      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > ir-remote-release.jks
          test -s ir-remote-release.jks

      - name: Gerar APK assinado
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/ir-remote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleGithubRelease --stacktrace --info 2>&1 | tee build.log

      - name: Guardar log da compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verificar APK assinado
        run: |
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" app/build/outputs/apk/github/release/app-release.apk
          cd app/build/outputs/apk/github/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Disponibilizar APK e hash
        uses: actions/upload-artifact@v4
        with:
          name: IR-Remote-BR-2.0.3-release
          path: |
            app/build/outputs/apk/github/release/app-release.apk
            app/build/outputs/apk/github/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING: ${{ inputs.replace_existing || (github.event_name == 'push' && contains(github.event.head_commit.message, '[republish-v2.0.3]')) }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          TAG="v$VERSION"
          APK=app/build/outputs/apk/github/release/app-release.apk
          HASH=app/build/outputs/apk/github/release/app-release.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE_EXISTING" != "true" ]; then
              echo "A Release $TAG ja existe. Nada foi sobrescrito. Para republicar, execute manualmente o workflow e marque replace_existing."
              exit 1
            fi
            gh release upload "$TAG" "$APK" "$HASH" --clobber
          else
            gh release create "$TAG" "$APK" "$HASH" --title "IR Remote BR $VERSION" --generate-notes
          fi

      - name: Limpar keystore
        if: always()
        run: rm -f ir-remote-release.jks
