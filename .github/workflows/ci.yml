name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Lint
        run: gradle lint

      - name: Unit tests
        run: gradle test

      - name: Preparar keystore de release
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > ir-remote-release.jks
          test -s ir-remote-release.jks

      - name: APK Release assinado
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/ir-remote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleGithubRelease

      - name: Verificar assinatura do APK
        run: |
          test -f app/build/outputs/apk/github/release/app-github-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/github/release/app-github-release.apk

      - name: Upload APK de release
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemoteSemAds-release
          path: app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error

      - name: Limpar keystore
        if: always()
        run: rm -f ir-remote-release.jks
