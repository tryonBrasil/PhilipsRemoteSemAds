name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Lint
        run: gradle lint

      - name: Unit tests
        run: gradle test

      - name: Debug APK
        run: gradle assembleGithubDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemoteSemAds-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
