plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.philipsremote'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 84
        versionName '2.0.17'
        buildConfigField "String", "WEB_CLIENT_ID", '"616140212-of0jb1kmrggbinp8b47na5sbvglejvsq.apps.googleusercontent.com"'
    }

    flavorDimensions "dist"
    productFlavors {
        github {
            dimension "dist"
            applicationId "com.example.philipsremote"
            buildConfigField "boolean", "ATUALIZACAO_POR_APK", "true"
        }
        play {
            dimension "dist"
            applicationId "io.github.tryonbrasil.irremote"
            buildConfigField "boolean", "ATUALIZACAO_POR_APK", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}

// O app publicado na Play usa outro applicationId e ainda não tem cliente Firebase próprio.
// Evita que o Google Services falhe ao gerar variantes Play; a variante GitHub usa google-services.json.
tasks.configureEach { task ->
    if (task.name.startsWith("processPlay") && task.name.endsWith("GoogleServices")) {
        task.enabled = false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    testImplementation 'junit:junit:4.13.2'
}