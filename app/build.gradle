plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.philipsremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.philipsremote'
        minSdk 23
        targetSdk 35
        versionCode 26
        versionName '1.3.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sem keystore no ambiente (build local), usa a assinatura de debug para o release poder ser gerado/testado.
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    testImplementation 'junit:junit:4.13.2'
}
