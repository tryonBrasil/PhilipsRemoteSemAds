plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.philipsremote'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 67
        versionName '2.0.0'
    }

    flavorDimensions "dist"
    productFlavors {
        github {
            dimension "dist"
            applicationId "com.example.philipsremote"
            buildConfigField "boolean", "ATUALIZACAO_POR_APK", "true"
        }
        play {
            dimension "dist"
            applicationId "io.github.tryonbrasil.irremote"
            buildConfigField "boolean", "ATUALIZACAO_POR_APK", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    testImplementation 'junit:junit:4.13.2'
}